FDB_CLUSTER=foundationdb-hmq-restore-bench
ATLAS_CONTEXT=prod
DATACENTER=us1.staging.dog
KUBE_CLUSTER=oddish-a
# One kubectl context per zonal k8s cluster the worker deploys to (oddish-a/b/c). Only oddish-a
# is authorized so far: create/run/delete refuse until all three are listed (EXPECTED_ZONES=3).
KUBE_CONTEXTS="${KUBE_CONTEXTS:-oddish-a.us1.staging.dog}"
# Empty: worker default LOCK_DB gate (Slack prompt up to 15 min, then DB locked 2 h before deletion).
# DELETION_GATE_TYPE_NOOP skips it; only set it with the user's explicit approval.
DELETE_GATES="${DELETE_GATES:-}"
SLACK_CHANNEL=
BACKUP_FOLDER=foundationdb-hsi-default-2025-03-v0
# Empty: the series version recorded by the first run (runs/series-restore-version), or the
# latest restorable version if no series is started yet. Delete that file to start a new series.
RESTORE_VERSION="${RESTORE_VERSION:-$(cat "$BENCH_DIR/runs/series-restore-version" 2>/dev/null || true)}"
BACKUP_SIZE_GIB=200
CLUSTER_REDUNDANCY=three_data_hall
CLUSTER_ENGINE=ssd
